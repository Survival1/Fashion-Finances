    <script>
      // Intercept and swallow benign iframe websocket connection rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason && (event.reason.message || event.reason)) || '';
        if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('QuotaExceeded') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.error)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
