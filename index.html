<!doctype html>
<html lang="en" style="overflow-x: hidden; max-width: 100%; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Finances — Crowdfunding Colectivo de Moda y Modelaje</title>
    <script>
      // Intercept and swallow benign iframe websocket connection rejections
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason && (event.reason.message || event.reason)) || '';
        if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('QuotaExceeded') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.error)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body style="overflow-x: hidden; max-width: 100%; width: 100%; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
