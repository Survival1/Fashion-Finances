<!doctype html>
<html lang="en" style="overflow-x: hidden; max-width: 100%; width: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Finances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <meta name="description" content="Plataforma innovadora de financiamiento colectivo y afiliación estratégica que fusiona el financiamiento de proyectos y la industria del modelaje." />
    <meta property="og:title" content="Fashion Finances" />
    <meta property="og:description" content="Plataforma innovadora de financiamiento colectivo y afiliación estratégica que fusiona el financiamiento de proyectos y la industria del modelaje." />
    <script>
      (function() {
        // Prevent benign Vite websocket connection rejections & log pollution
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              try {
                var ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
                ws.addEventListener('error', function(e) {
                  if (e && typeof e.stopImmediatePropagation === 'function') {
                    e.stopImmediatePropagation();
                  }
                });
                return ws;
              } catch (err) {
                return {
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  send: function() {},
                  close: function() {},
                  readyState: 3
                };
              }
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          }
        } catch (e) {}

        // Filter console errors and warnings for benign dev websocket rejections
        var origError = console.error;
        var origWarn = console.warn;
        console.error = function() {
          var text = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack)) ? (a.message + ' ' + (a.stack || '')) : String(a);
          }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('failed to connect') !== -1 || text.indexOf('[vite]') !== -1 || text.indexOf('closed without opened') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
        console.warn = function() {
          var text = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack)) ? (a.message + ' ' + (a.stack || '')) : String(a);
          }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('failed to connect') !== -1 || text.indexOf('[vite]') !== -1 || text.indexOf('closed without opened') !== -1) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        // Suppress unhandled promise rejections and error events for websocket/vite
        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason && (event.reason.message || event.reason.stack || event.reason)) || '';
          var text = String(reason);
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1 || text.indexOf('failed to connect') !== -1 || text.indexOf('vite') !== -1 || text.indexOf('QuotaExceeded') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.error)) || '';
          var text = String(msg);
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('closed without opened') !== -1 || text.indexOf('failed to connect') !== -1 || text.indexOf('vite') !== -1 || text.indexOf('QuotaExceeded') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body style="overflow-x: hidden; max-width: 100%; width: 100%; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
